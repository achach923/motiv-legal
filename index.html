<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --forest-900:#0B2818; --accent:#22C55E; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Poppins',sans-serif;
    background:linear-gradient(155deg,var(--forest-900) 0%, #123420 100%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    color:#fff; text-align:center; padding:20px;
  }
  .logo{ font-size:34px; font-weight:800; margin-bottom:6px; }
  .logo span{ color:var(--accent); }
  .tag{ color:rgba(255,255,255,0.55); font-size:14px; margin-bottom:36px; }
  .links{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  a.btn{
    background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.18);
    color:#fff; text-decoration:none; padding:14px 24px; border-radius:24px;
    font-weight:700; font-size:14px;
  }
  a.btn:hover{ background:var(--accent); color:var(--forest-900); border-color:var(--accent); }
</style>
</head>
<body>
  <div class="logo">motiv<span>.</span></div>
  <div class="tag">Trouve ton binôme sport</div>
  <div class="links">
    <a class="btn" href="./privacy.html">Politique de confidentialité</a>
    <a class="btn" href="./support.html">Support</a>
  </div>
</body>
</html>
